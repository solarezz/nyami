# /etc/nginx/sites-available/nyami.solarezz.dev
# HTTP-блок. После `certbot --nginx -d nyami.solarezz.dev` Certbot сам допишет
# SSL-блок на 443 и редирект 80→443 (как у app.speaktoria.ru).

server {
    listen 77.91.79.169:80;
    server_name nyami.solarezz.dev;

    # под загрузку фото (base64) — иначе nginx режет на 1 МБ
    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
